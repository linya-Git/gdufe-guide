<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>广财新生攻略助手</title>
<style>
:root {
  --bg: #0f1117; --panel: #171a23; --panel2: #1e2230; --border: #2a2f3d;
  --text: #e8eaf0; --muted: #9aa3b5; --accent: #4f8cff; --accent2: #6ba3ff;
  --user-bubble: #2b3a5e; --assistant-bubble: #1e2230; --green: #3ddc84;
  --radius: 14px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

.header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; background: var(--panel); flex-shrink: 0; }
.header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.header span { font-size: 14px; font-weight: 600; }
.header .sub { font-size: 12px; color: var(--muted); margin-left: auto; }

.chat { flex: 1; overflow-y: auto; padding: 24px 16px; }
.welcome { text-align: center; margin: 30px auto 18px; max-width: 640px; }
.welcome h2 { font-size: 22px; margin-bottom: 6px; }
.welcome p { color: var(--muted); font-size: 13.5px; line-height: 1.7; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 720px; margin: 0 auto 16px; }
.chip { background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: all .15s; }
.chip:hover { background: var(--accent); border-color: var(--accent); }
.chips.hidden { display: none; }

.msg { display: flex; gap: 10px; margin-bottom: 16px; max-width: 860px; margin-left: auto; margin-right: auto; }
.msg .avatar { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.msg.user { flex-direction: row-reverse; }
.msg.user .avatar { background: #3b4a6e; }
.msg.assistant .avatar { background: var(--accent); }
.msg .bubble { background: var(--assistant-bubble); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; font-size: 14.5px; line-height: 1.75; max-width: 100%; overflow-wrap: break-word; }
.msg.user .bubble { background: var(--user-bubble); border-color: transparent; }
.bubble pre { background: #0d0f14; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 13px; margin: 8px 0; }
.bubble code { background: #0d0f14; padding: 2px 5px; border-radius: 4px; font-size: 13px; }
.bubble h3, .bubble h4 { margin: 14px 0 8px; }
.bubble h3:first-child, .bubble h4:first-child { margin-top: 0; }
.bubble hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
.bubble ul, .bubble ol { padding-left: 20px; margin: 6px 0; }
.bubble p { margin: 6px 0; }
.cursor { display: inline-block; width: 8px; height: 16px; background: var(--accent); margin-left: 2px; vertical-align: -2px; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0; } }

.refs { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 860px; margin-left: auto; margin-right: auto; }
.ref { font-size: 12px; color: var(--accent2); background: rgba(79,140,255,.1); border: 1px solid rgba(79,140,255,.3); padding: 3px 10px; border-radius: 12px; cursor: pointer; }
.ref:hover { background: rgba(79,140,255,.2); }

.input-area { border-top: 1px solid var(--border); padding: 14px 16px 18px; background: var(--panel); flex-shrink: 0; }
.input-box { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; background: var(--panel2); border: 1px solid var(--border); border-radius: 16px; padding: 6px 6px 6px 16px; align-items: flex-end; transition: border-color .2s; }
.input-box:focus-within { border-color: var(--accent); }
textarea { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 14.5px; resize: none; padding: 10px 0; max-height: 140px; font-family: inherit; line-height: 1.5; }
.send-btn { background: var(--accent); border: none; color: #fff; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; font-size: 18px; flex-shrink: 0; transition: opacity .15s; }
.send-btn:hover { opacity: .85; }
.send-btn:disabled { opacity: .4; cursor: not-allowed; }
.hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }

/* 原文弹窗 */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: none; z-index: 100; }
.overlay.show { display: flex; align-items: center; justify-content: center; }
.overlay .box { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; width: min(720px, 92vw); height: min(600px, 86vh); display: flex; flex-direction: column; overflow: hidden; }
.overlay .box .top { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--border); }
.overlay .box .top b { font-size: 14px; }
.overlay .box .top .close { cursor: pointer; color: var(--muted); font-size: 20px; padding: 0 4px; }
.overlay .box .top .close:hover { color: var(--text); }
.overlay .box .body { overflow-y: auto; padding: 16px 20px; font-size: 13.5px; line-height: 1.8; white-space: pre-wrap; }
.overlay .box .body img { max-width: 100%; border-radius: 8px; margin: 6px 0; cursor: zoom-in; }

@media (max-width: 640px) {
  .chat { padding: 16px 10px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="dot"></div>
  <span>🎓 广财新生攻略助手</span>
  <select id="modelSel" style="background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-size:12px;outline:none"></select>
  <span class="sub">数据快照 2026-08-22</span>
</div>

<div class="chat" id="chat">
  <div class="welcome">
    <h2>👋 你好，新同学！</h2>
    <p>基于《2026广东财经大学新生攻略》一手资料，宿舍、食堂、转专业、社团……随便问</p>
  </div>
  <div class="chips" id="chips">
    <button class="chip">佛山校区宿舍几人间？</button>
    <button class="chip">开学要带什么证件材料？</button>
    <button class="chip">转专业有什么条件？</button>
    <button class="chip">医务室几点上班？</button>
    <button class="chip">食堂有哪些？</button>
    <button class="chip">校内怎么出行？</button>
  </div>
</div>

<div class="input-area">
  <div class="input-box">
    <textarea id="input" rows="1" placeholder="输入你的问题，例如：宿舍条件怎么样…"></textarea>
    <button class="send-btn" id="sendBtn" title="发送">➤</button>
  </div>
  <div class="hint">回答由 Agnes 生成 + 本地知识库检索 · 重要信息以学校官方为准</div>
</div>

<div class="overlay" id="overlay">
  <div class="box">
    <div class="top"><b id="ovTitle">参考资料</b><span class="close" onclick="closeOv()">×</span></div>
    <div class="body" id="ovBody"></div>
  </div>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const chipsEl = document.getElementById('chips');
const modelSel = document.getElementById('modelSel');
let history = [];
let streaming = false;

/* ---------- 模型切换 ---------- */
const savedModel = localStorage.getItem('gdufe_model');
fetch('/api/models').then(r => r.json()).then(providers => {
  providers.forEach(p => {
    p.models.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = (p.name === 'Agnes（免费）' ? '✨ ' : '') + p.name + ' · ' + m;
      modelSel.appendChild(opt);
    });
  });
  if (savedModel && [...modelSel.options].some(o => o.value === savedModel)) {
    modelSel.value = savedModel;
  }
});
modelSel.addEventListener('change', () => localStorage.setItem('gdufe_model', modelSel.value));

/* ---------- 原文弹窗（引用点击） ---------- */
function openKb(file) {
  fetch('/kb/' + file).then(r => r.text()).then(md => {
    document.getElementById('ovTitle').textContent = file.replace(/^\d+-/, '').replace('.md', '');
    const body = document.getElementById('ovBody');
    let html = '';
    for (const ln of md.split('\n')) {
      if (ln.startsWith('# ')) html += '\n' + ln.slice(2) + '\n' + '─'.repeat(30) + '\n';
      else if (ln.startsWith('## ')) html += '\n◆ ' + ln.slice(3) + '\n';
      else if (ln.startsWith('![')) { /* 图片暂不展示 */ }
      else html += ln + '\n';
    }
    body.innerHTML = html;
    document.getElementById('overlay').classList.add('show');
    body.scrollTop = 0;
  });
}
function closeOv() { document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeOv(); });

/* 大图预览 */
function showBigImg(src) {
  const b = document.getElementById('ovBody');
  document.getElementById('ovTitle').textContent = '图片预览';
  b.innerHTML = '<img src="' + src + '" style="max-width:100%;border-radius:8px" onclick="closeOv()">';
  document.getElementById('overlay').classList.add('show');
}

/* ---------- 聊天 ---------- */
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function tidyAnswer(s, final) {
  let out = s.replace(/^[\s\u200b\ufeff]+/, '').replace(/\n{3,}/g, '\n\n');
  if (final) out = out.replace(/[\s\u200b\ufeff]+$/, '');
  return out;
}

function mdToHtml(md) {
  md = esc(md);
  md = md.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  md = md.replace(/`([^`]+)`/g, '<code>$1</code>');
  // 分隔线：单独一行的 --- / *** / ___
  md = md.replace(/^\s*[-*_]{3,}\s*$/gm, '<hr>');
  // 标题（吃掉整行，不留下换行）
  md = md.replace(/^\s*#### (.+)$/gm, '<h4>$1</h4>');
  md = md.replace(/^\s*### (.+)$/gm, '<h3>$1</h3>');
  md = md.replace(/^\s*## (.+)$/gm, '<h3>$1</h3>');
  // 无序列表
  md = md.replace(/^\s*[-*] (.+)$/gm, '• $1');
  // 两个以上换行算段落，单换行算折行
  md = md.replace(/\n{2,}/g, '\u0000');
  md = md.replace(/\n/g, '<br>');
  md = md.replace(/\u0000/g, '<br><br>');
  // 标题、分割线前后不留 <br>，间距交给 CSS
  md = md.replace(/(?:<br>)+(<h[34]>|<hr>)/g, '$1');
  md = md.replace(/(<\/h[34]>|<hr>)(?:<br>)+/g, '$1');
  return md;
}

function addMsg(role, html, refs, imgs) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  wrap.innerHTML = '<div class="avatar">' + (role === 'user' ? '🙋' : '🎓') + '</div><div><div class="bubble">' + html + '</div></div>';
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return wrap;
}

/* 渲染回答下方的 引用+图片+反馈按钮（bubble 之后） */
function renderExtras(wrap, refs, imgs) {
  // 防御：已有 extras 则不重复添加
  if (wrap.querySelector('.refs')) return;
  const extra = document.createElement('div');
  extra.className = 'refs';
  if (refs && refs.length) {
    refs.forEach(r => {
      const s = document.createElement('span');
      s.className = 'ref';
      let src = (r.source || '').replace(/\.md$/i, '').replace(/^\d+[-_\s]*/, '');
      let sec = (r.section || '').replace('图片内容（OCR识别）', '相关图片').replace('图片内容（OCR 识别）', '相关图片');
      if (sec.length > 14) sec = sec.slice(0, 14) + '…';
      s.textContent = sec ? (src + ' / ' + sec) : src;
      s.title = r.source + ' / ' + (r.section || '');
      s.onclick = () => openKb(r.source);
      extra.appendChild(s);
    });
  }
  if (imgs && imgs.length) {
    const imgRow = document.createElement('div');
    imgRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;margin-top:8px';
    imgs.forEach(name => {
      const img = document.createElement('img');
      img.src = '/images/' + name;
      img.style.cssText = 'width:140px;height:100px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--border)';
      img.title = name;
      img.onclick = () => showBigImg('/images/' + name);
      imgRow.appendChild(img);
    });
    extra.appendChild(imgRow);
  }
  const fb = document.createElement('span');
  fb.className = 'ref';
  fb.style.borderColor = 'rgba(61,220,132,.4)';
  fb.style.color = '#3ddc84';
  fb.textContent = '✏️ 信息有误/过时？点我反馈';
  fb.onclick = async () => {
    const note = window.prompt('请简要说明哪里不对（如：小白车现在扫码1元）：', '');
    if (!note) return;
    const q = wrap.querySelector('.bubble').getAttribute('data-q') || '';
    const r = await fetch('/api/feedback', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q, type: 'correction', note }),
    });
    const j = await r.json();
    fb.textContent = j.ok ? '✅ 已记录，谢谢反馈' : '（已忽略：非广财相关）';
    setTimeout(() => { fb.textContent = '✏️ 信息有误/过时？点我反馈'; }, 3000);
  };
  extra.appendChild(fb);
  wrap.querySelector('.bubble').after(extra);
  chatEl.scrollTop = chatEl.scrollHeight;
}

document.querySelectorAll('.chip').forEach(c => c.onclick = () => send(c.textContent));

function autoResize() { inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px'; }
inputEl.addEventListener('input', autoResize);
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
sendBtn.onclick = send;

async function send(text) {
  const query = (text || inputEl.value).trim();
  if (!query || streaming) return;
  inputEl.value = ''; autoResize();
  chipsEl.classList.add('hidden');
  addMsg('user', esc(query), []);
  history.push({ role: 'user', content: query });

  const wrap = addMsg('assistant', '<span class="cursor"></span>', [], []);
  const bubble = wrap.querySelector('.bubble');
  bubble.setAttribute('data-q', query);
  streaming = true; sendBtn.disabled = true;
  let answer = '';
  let refs = [];
  let imgs = [];
  try {
    const resp = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, history: history.slice(0, -1), model: modelSel.value }),
    });
    if (!resp.ok) { bubble.innerHTML = '请求失败 (' + resp.status + ')'; return; }
    if (resp.headers.get('content-type').includes('event-stream')) {
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      let finished = false;
      while (!finished) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split('\n\n');
        buf = parts.pop();
        for (const p of parts) {
          if (!p.startsWith('data:')) continue;
          let obj; try { obj = JSON.parse(p.slice(5).trim()); } catch { continue; }
          if (obj.type === 'refs') { refs = obj.refs || []; imgs = obj.images || []; }
          else if (obj.type === 'delta') { answer += obj.text; bubble.innerHTML = mdToHtml(tidyAnswer(answer, false)) + '<span class="cursor"></span>'; chatEl.scrollTop = chatEl.scrollHeight; }
          else if (obj.type === 'error') { bubble.innerHTML = '⚠️ ' + esc(obj.text); }
          else if (obj.type === 'done') { bubble.innerHTML = mdToHtml(tidyAnswer(answer, true)); finished = true; break; }
        }
      }
    } else {
      const j = await resp.json();
      answer = j.answer || '（无回答）';
      refs = j.references || [];
      bubble.innerHTML = mdToHtml(answer);
    }
  } catch (e) {
    if (!answer) bubble.innerHTML = '⚠️ 网络错误: ' + esc(e.message);
  } finally {
    if (answer) {
      bubble.innerHTML = mdToHtml(answer);
    } else {
      bubble.innerHTML = bubble.innerHTML.replace(/<span class="cursor"><\/span>/, '');
    }
    renderExtras(wrap, refs, imgs);
    history.push({ role: 'assistant', content: answer });
    if (history.length > 20) history = history.slice(-20);
    streaming = false; sendBtn.disabled = false;
    inputEl.focus();
  }
}
</script>
</body>
</html>
